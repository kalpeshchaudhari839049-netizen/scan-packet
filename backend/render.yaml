services:
  - type: web
    name: code-alpha-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_PATH
        value: /var/data/reports.db
      - key: FRONTEND_ORIGIN
        sync: false
    disk:
      name: code-alpha-reports
      mountPath: /var/data
      sizeGB: 1
