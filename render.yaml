services:
  - type: web
    name: code-alpha-api
    runtime: python
    plan: starter
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_PATH
        value: /var/data/reports.db
      - key: CORS_ORIGINS
        value: https://code-alpha-frontend.onrender.com,http://localhost:5173,http://127.0.0.1:5173
    disk:
      name: code-alpha-reports
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: code-alpha-frontend
    runtime: static
    buildCommand: npm ci --prefix frontend && npm run build --prefix frontend
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://code-alpha-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
